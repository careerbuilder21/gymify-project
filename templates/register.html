{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GYMIFY</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="nav-logo">GYM<span>IFY</span></div>
        <ul class="nav-links">
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
            <li><a href="{% url 'public_store' %}">Store</a></li>
            <li><a href="{% url 'public_courses' %}">Workout Courses</a></li>
            <li><a href="{% url 'contact' %}">Contact Us</a></li>
        </ul>
        <div class="nav-buttons">
            <a href="{% url 'login' %}" class="btn-outline">Login</a>
            <a href="{% url 'register' %}" class="btn-solid">Sign Up</a>
        </div>
    </nav>

    <!-- REGISTER FORM -->
    <div class="form-section form-section-wide">
        <div class="form-box">

            <div class="auth-logo-box" style="text-align:center;margin-bottom:20px;">
                <div class="auth-logo-title" style="font-size:28px;font-weight:800;">GYM<span
                        style="color:#E63946;">IFY</span></div>
                <p class="auth-logo-subtitle" style="color:#858685;font-size:14px;margin-top:5px;">Create your member
                    account</p>
            </div>
            {% if error %}
            <p class="error-msg">{{ error }}</p>
            {% endif %}
            <h2>Member Registration</h2>

            <form method="POST" action="{% url 'register' %}" autocomplete="off">
                {% csrf_token %}

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="reg-name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="text" name="reg-email" autocomplete="new-email" placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="reg-phone" placeholder="e.g. 0300-0000000" required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="reg-age" placeholder="Enter your age" required>
                </div>

                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" name="reg-weight" placeholder="Enter your weight" required>
                </div>

                <div class="form-group">
                    <label>Membership Plan</label>
                    <select name="reg-membership" required>
                        <option value="">Select a Plan</option>
                        <option value="basic">Basic PKR 2,000/month</option>
                        <option value="standard">Standard PKR 3,500/month</option>
                        <option value="premium">Premium PKR 5,000/month</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="reg-password" id="reg-password-field" autocomplete="new-password"
                            placeholder="Create a password" required>
                        <i class="fa fa-eye eye-btn" id="reg-eye-icon" onclick="toggleRegPassword()">
                        </i>
                    </div>
                </div>
        <div class="form-group">
            <label>Security Question</label>
            <input type="text" value="What is your Date of Birth?" disabled class="security-input-disabled">
        </div>
        <div class="form-group">
            <label>Security Answer</label>
            <input type="text" name="security_answer" placeholder="Type your Date of Birth" autocomplete="off" required>
        </div>
        <button type="submit" class="form-btn">
            Create Account
        </button>
        </form>
        <div class="form-footer">
            <p>Already have an account?
                <a href="{% url 'login' %}">Login here</a>
            </p>
        </div>
    </div>
    </div>
    </div>
    <script src="{% static 'js/script.js' %}"></script>
</body>

</html>
