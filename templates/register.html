{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GYMIFY</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/script.js' %}" defer></script>
</head>
<body>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="nav-logo">GYM<span>IFY</span></div>
        <ul class="nav-links">
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'about' %}">About Us</a></li>
            <li><a href="{% url 'public_store' %}">Store</a></li>
            <li><a href="{% url 'public_courses' %}">Workout Courses</a></li>
            <li><a href="{% url 'contact' %}">Contact</a></li>
        </ul>
        <div class="nav-buttons">
            <a href="{% url 'login' %}" class="btn-outline">Login</a>
            <a href="{% url 'register' %}" class="btn-solid">Sign Up</a>
        </div>
    </nav>

    <!-- REGISTER FORM -->
    <div class="form-section" style="max-width:550px;">
        <div class="form-box">
            <div style="text-align:center;margin-bottom:20px;">
                <div style="font-size:28px;font-weight:800;">GYM<span style="color:#E63946;">IFY</span></div>
                <p style="color:#858685;font-size:14px;margin-top:5px;">Create your member account</p>
            </div>
            <h2>Member Registration</h2>
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" name="reg-email" autocomplete="new-email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="reg-phone">Phone Number</label>
                <input type="text" id="reg-phone" placeholder="e.g. 0300-0000000">
            </div>
            <div class="form-group">
                <label for="reg-age">Age</label>
                <input type="number" id="reg-age" placeholder="Enter your age">
            </div>
            <div class="form-group">
                <label for="reg-weight">Weight (kg)</label>
                <input type="number" id="reg-weight" placeholder="Enter your weight">
            </div>
            <div class="form-group">
                <label for="reg-membership">Membership Plan</label>
                <select id="reg-membership">
                    <option value="">Select a Plan</option>
                    <option value="basic">Basic - PKR 2,000/month</option>
                    <option value="standard">Standard - PKR 3,500/month</option>
                    <option value="premium">Premium - PKR 5,000/month</option>
                </select>
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" name="reg-password" autocomplete="new-password" placeholder="Create a password">
            </div>
            <button class="form-btn" onclick="handleRegister()">Create Account</button>
            <div class="form-footer">
                <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
            </div>
             <div class="form-group">
                 <label>Security Question</label>
                   <input type="text" value="What is your Mother Name?" disabled style="background:#eee;color:#858685;"></div>

             <div class="form-group">
               <label>Security Answer</label>
                 <input type="text" name="security_answer" placeholder="Type your Mother Name" autocomplete="off"></div>
        </div>
    </div>
</body>
</html>
