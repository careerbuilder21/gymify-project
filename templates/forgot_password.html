{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forgot Password - GYMIFY</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav class="navbar">
        <div class="nav-logo">GYM<span>IFY</span></div>
        <div class="nav-buttons">
            <a href="{% url 'login' %}" class="btn-solid">Login</a>
        </div>
    </nav>

    <div class="form-section">
        <div class="form-box">

            <div style="text-align:center;margin-bottom:20px;">
                <div style="font-size:28px;font-weight:800;">
                    GYM<span style="color:#E63946;">IFY</span>
                </div>
                <p style="color:#858685;font-size:14px;margin-top:5px;">
                    Password Reset
                </p>
            </div>

            {% if error %}
            <p style="color:red;text-align:center;
                      font-size:14px;margin-bottom:15px;">
                {{ error }}
            </p>
            {% endif %}

            <h2 style="font-size:22px;text-align:center;
                       margin-bottom:20px;">
                Forgot Password
            </h2>

            <p style="color:#858685;font-size:14px;
                      text-align:center;margin-bottom:20px;">
                Enter your registered Email
            </p>

            <form method="POST" action="/forgot-password/" autocomplete="off">
                {% csrf_token %}
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="text" name="email" placeholder="Type Your Email">
                </div>
                <button type="submit" class="form-btn">
                    Next
                </button>
            </form>
            <div class="form-footer">
                <p><a href="{% url 'login' %}">Back to Login</a></p>
            </div>
        </div>
    </div>
</body>

</html>
